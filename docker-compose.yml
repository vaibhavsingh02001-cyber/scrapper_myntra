version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: scapper_postgres
    restart: always
    environment:
      POSTGRES_DB: scapper
      POSTGRES_USER: scapper
      POSTGRES_PASSWORD: scapper_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scapper_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://scapper:scapper_secure_password_123@db:5432/scapper
    depends_on:
      - db
    volumes:
      - ./backend/artifacts:/app/backend/artifacts
      - ./backend/storage:/app/backend/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scapper_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
